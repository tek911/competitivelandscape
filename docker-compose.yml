services:
  postgres:
    image: postgres:16-alpine
    container_name: capabilities-db
    environment:
      POSTGRES_DB: capabilities_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - capabilities-network

  redis:
    image: redis:7-alpine
    container_name: capabilities-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - capabilities-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: capabilities-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/capabilities_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      CORS_ORIGIN: http://localhost
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-anthropic.claude-3-sonnet-20240229-v1:0}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-this-32-character-key}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - capabilities-network
    command: sh -c "npx prisma db push && node dist/index.js"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: capabilities-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - capabilities-network

volumes:
  postgres_data:
  redis_data:
  backend_uploads:

networks:
  capabilities-network:
    driver: bridge
